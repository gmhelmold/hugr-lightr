[package]
name = "lightr-cri-serve"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "OPT-IN composition root: wires the real LightrBackend into the vendored kubelet-facing lightr-cri server shell via a thin type-adapter over the CriBackend seam."

# OWN, ISOLATED WORKSPACE — decoupled from the hugr-lightr root workspace ON
# PURPOSE. The root Cargo.toml ALSO lists this crate in `[workspace] exclude`,
# so a normal `cargo build` / `cargo build --workspace` at the repo root NEVER
# builds this crate or pulls tonic/gRPC into the core build. This is the
# only crate in hugr-lightr that depends on the CRI shell (tonic/tokio/gRPC),
# which the dependency firewall (ADR-0017 decision 5) keeps OUT of the default
# build. Validate it explicitly:
#   cargo build --manifest-path crates/lightr-cri-serve/Cargo.toml
[workspace]

[[bin]]
name = "lightr-cri-serve"
path = "src/main.rs"

[dependencies]
# The REAL backend (this workspace): LightrBackend + its seam vocab.
lightr-cri-backend = { package = "hugr-lightr-cri-backend", path = "../lightr-cri-backend" }

# Canonical seam + vocab, vendored into this repository. The package name
# collides with this workspace's transcribed backend, so keep the dependency
# renamed as `cri-canon`; both crates are path dependencies at distinct paths.
cri-canon = { package = "lightr-cri-backend", path = "../lightr-cri/crates/lightr-cri-backend" }

# Backend-agnostic server composition root. `default-features = false` drops
# the fake backend + conformance bin; we only need generic serving.
lightr-cri-server = { path = "../lightr-cri/crates/lightr-cri-server", default-features = false }
