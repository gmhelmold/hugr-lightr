[package]
name = "bench-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "bench-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"
blake3 = { version = "1", features = ["rayon", "mmap"] }
rayon = "1"
walkdir = "2"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"