projects:
- id: kubernetes-kind
  name: Kubernetes (Kind)
  repo: https://github.com/kubernetes/kubernetes
  commit: v1.29.4
  commit_hash: 5d985937e8a112a321916efd4ad3936c7db6345f
  description: 'Kind runs Kubernetes in Docker containers. Tests: Go multi-stage builds,
    Docker-in-Docker (DinD), multi-node clusters, CNI networking (kindnet, calico,
    cilium), CRI integration, volumes (emptyDir, hostPath, configMap, secret, PVC),
    init containers, sidecars, ephemeral containers, health checks (liveness, readiness,
    startup), resource limits (CPU, memory, hugepages), affinity/anti-affinity, taints/tolerations,
    RBAC, PSP, NetworkPolicy, CRDs, operators, webhooks.'
  dockerfiles:
  - path: build/pause/Dockerfile
    name: pause
    description: Pause container (base for all pods)
  - path: build/debian-base/Dockerfile
    name: debian-base
  - path: build/kube-apiserver/Dockerfile
    name: kube-apiserver
    description: Multi-stage Go build (builder -> distroless)
  - path: build/kube-controller-manager/Dockerfile
    name: kube-controller-manager
  - path: build/kube-scheduler/Dockerfile
    name: kube-scheduler
  - path: build/kube-proxy/Dockerfile
    name: kube-proxy
  - path: build/kubectl/Dockerfile
    name: kubectl
  - path: cluster/images/etcd/Dockerfile
    name: etcd
  - path: cluster/images/coredns/Dockerfile
    name: coredns
  - path: cmd/kind/Dockerfile
    name: kind-node
    description: Kind node image (systemd, containerd, kubeadm)
  compose_files:
  - path: kind/examples/multi-node.yaml
    name: kind-multi-node
    description: 3 control-plane + 3 workers
  - path: kind/examples/kind-with-registry.yaml
    name: kind-with-registry
  - path: kind/examples/kind-with-calico.yaml
    name: kind-calico
  - path: kind/examples/kind-with-cilium.yaml
    name: kind-cilium
  test_workloads:
  - name: nginx-deployment
    manifest: kind/examples/nginx-deployment.yaml
    replicas: 10
    validation: curl -s http://<pod-ip> | grep "Welcome to nginx"
  - name: statefulset-postgres
    manifest: kind/examples/postgres-statefulset.yaml
    validation: psql -h <svc> -c "SELECT 1"
  - name: daemonset-logging
    manifest: kind/examples/fluentd-daemonset.yaml
    validation: logs appear in Loki
- id: elasticsearch
  name: Elasticsearch
  repo: https://github.com/elastic/elasticsearch
  commit: v8.13.4
  commit_hash: 85ff3fe65dcf2ab0185083aee4b8f462a92ab289
  description: 'Elasticsearch official image. Tests: Java/JVM multi-stage build (Gradle
    + JDK), JVM tuning (heap, GC, JIT, compiler thresholds), security: TLS (transport
    + HTTP), PKI, keystore, PKCS#12, authentication: native realm, file realm, LDAP,
    SAML, OIDC, authorization: RBAC, document/field level security, clustering: discovery
    (zen, EC2, GCE, Azure), master-eligible nodes, data persistence: indices, shards,
    replicas, translog, snapshots, snapshot/restore (S3, GCS, Azure, filesystem repo),
    ILM (hot/warm/cold/frozen/delete), SLM, cross-cluster replication (CCR), searchable
    snapshots (frozen tier), machine learning (if x-pack), APM server integration,
    Fleet/Elastic Agent, Beats (Filebeat, Metricbeat, Packetbeat, Heartbeat), Logstash
    pipeline, Kibana dashboards.'
  dockerfiles:
  - path: docker/Dockerfile
    name: elasticsearch
    description: Main Elasticsearch image — multi-stage (builder + runtime)
  - path: docker/Dockerfile.arm64
    name: elasticsearch-arm64
    description: ARM64 variant
  - path: docker/Dockerfile.fips
    name: elasticsearch-fips
    description: FIPS 140-2 compliant build
  compose_files:
  - path: docker-compose.yml
    name: es-single
    description: Single node (dev)
  - path: docker-compose.cluster.yml
    name: es-cluster
    description: 3-node cluster (master + data + coordinating)
  - path: docker-compose.security.yml
    name: es-security
    description: TLS + auth + RBAC + audit logging
  - path: docker-compose.snapshot.yml
    name: es-snapshot
    description: Snapshot repo (S3 mock) + SLM policy
  - path: docker-compose.ccr.yml
    name: es-ccr
    description: Cross-cluster replication (2 clusters)
  - path: docker-compose.ilm.yml
    name: es-ilm
    description: 'ILM policies: hot->warm->cold->frozen->delete'
  - path: docker-compose.beats.yml
    name: es-beats
    description: Filebeat + Metricbeat + Heartbeat + APM Server
  - path: docker-compose.fleet.yml
    name: es-fleet
    description: Elastic Agent + Fleet Server
  test_workloads:
  - name: bulk-indexing
    tool: esrally
    track: logging
    challenge: index-append
    validation: indexing throughput > 50k docs/sec
  - name: search-latency
    tool: esrally
    track: logging
    challenge: search-query
    validation: p99 latency < 100ms
  - name: snapshot-restore
    tool: curator
    action: snapshot -> delete index -> restore
    validation: doc count matches, search works
  - name: rolling-restart
    action: rolling restart of data nodes
    validation: cluster stays green, no shard relocation storms
  - name: ccr-failover
    action: pause replication -> promote follower -> verify
    validation: follower becomes leader, data consistent
