  - serde
  - tokio
  - sysinfo
  - procfs
  - cgroups
  - statrs
  - csv
  - parquet
  - arrow
  - plotters
  ci_integration: Requer GitHub Actions ou similar com rust toolchain
  status: ESPECIFICADO - não compilado/testado no CI atual
validator_implementation:
  checks:
  - name: output_equivalence
    method: diff stdout/stderr + exit_code
    tolerance: exact para exit_code; diff semântico para stdout/stderr (ignorar timestamps,
      PIDs, paths temporários)
    implementation: diff -u <(normalize stdout_docker) <(normalize stdout_lightr)
  - name: filesystem_equivalence
    method: tar + sha256sum com exclusões
    exclude_patterns:
    - '**/proc/**'
    - '**/sys/**'
    - '**/tmp/**'
    - '**/var/log/**'
    - '**/*.log'
    - '**/*mtime*'
    - '**/proc/*'
    - '**/sys/*'
    - /proc/*
    - /sys/*
    implementation: tar --exclude=... -cf - /container/path | sha256sum
  - name: network_equivalence
    method: iperf3 + curl + nslookup
    tolerance: throughput within 2%, latency within 5%
    implementation: iperf3 -c <target> -t 10; curl -w "@format" <url>; nslookup <host>
  - name: resource_limits_enforced
    method: cgroups v2 read
    tolerance: within 5%
    implementation: cat /sys/fs/cgroup/<container>/cpu.max; cat .../memory.max; cat
      .../pids.max
  - name: security_profile_active
    method: proc_pid_status + aa_status + capget
    tolerance: exact match
    implementation: grep -E "Seccomp|CapInh|CapPrm|CapEff" /proc/<pid>/status; aa-status
      --paranoid
  status: ESPECIFICADO - não implementado (requer implementação em Python/Rust)
reporter_implementation:
  language: Python 3.11+
  dependencies:
  - pandas
  - numpy
  - scipy
  - statsmodels
  - plotly
  - matplotlib
  - seaborn
  - pyarrow
  - jinja2
  input: results/raw/*.jsonl + results/raw/*.parquet
  outputs:
  - csv
  - parquet
  - json
  - html
  - pdf
  - markdown
  analysis_modules:
    descriptive: mean, median, std, min, max, q25, q75, p95, p99, cv
    inferential:
    - mann_whitney_u
    - wilcoxon
    - ttest_ind_welch
    - shapiro_wilk
    effect_sizes:
    - cohens_d
    - hedges_g
    - cliffs_delta
    - vargha_delaney_a
    confidence_intervals:
      method: bootstrap
      n_resamples: 10000
      ci: 0.95
      type: bca
    multiple_comparison:
      method: holm_bonferroni
      alpha: 0.05
      family: per_category
    power_analysis:
      post_hoc: true
      target_power: 0.8
      effect_size_threshold: 0.5
  visualizations:
  - boxplot
  - violin
  - scatter
  - bar
  - heatmap
  - forest_plot
  tables:
  - summary_by_category
  - speedup_factors
  - statistical_significance
  - outliers_detected
  status: ESPECIFICADO - não implementado (requer Python + deps)
