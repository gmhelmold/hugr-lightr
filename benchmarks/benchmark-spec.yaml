runner:
  name: bench-runner
  language: Rust
  version: 0.1.0
  execution:
    mode: sequential
    isolation:
      method: cgroups_v2
      cpu_controller: true
      memory_controller: true
      io_controller: true
      pids_controller: true
      cpuset: 0-5
      memory_limit_gb: 16
    reset_between_runs:
    - docker system prune -af --volumes
    - lightr system prune -af --volumes
    - echo 3 > /proc/sys/vm/drop_caches
    - sync
    - sleep 5
    warmup:
    - name: docker_warmup
      command: docker run --rm alpine:latest true
      repeat: 3
    - name: lightr_warmup
      command: lightr run --rm alpine:latest true
      repeat: 3
    - name: buildkit_warmup
      command: docker buildx build --load -t warmup:test -f Dockerfile.warmup .
      repeat: 2
  collector:
    interval_ms: 50
    backends:
    - name: cgroups_v2
      path: /sys/fs/cgroup
      metrics:
      - cpu.stat
      - memory.stat
      - memory.current
      - memory.peak
      - memory.swap.current
      - io.stat
      - pids.current
      - pids.peak
    - name: proc
      path: /proc
      metrics:
      - /proc/stat
      - /proc/meminfo
      - /proc/net/dev
      - /proc/diskstats
      - /proc/<pid>/stat
      - /proc/<pid>/io
    - name: perf
      enabled: true
      events:
      - cycles
      - instructions
      - cache-references
      - cache-misses
      - branch-instructions
      - branch-misses
      - context-switches
      - cpu-migrations
      - page-faults
      - major-faults
    - name: docker_api
      enabled: true
      endpoints:
      - /containers/<id>/stats
      - /images/<id>/json
      - /networks/<id>/json
      - /volumes/<id>/json
    - name: lightr_api
      enabled: true
      commands:
      - lightr inspect <id>
      - lightr stats <id> --no-stream
      - lightr system df
    sync_mechanism:
      current: polling assíncrono com intervalo 50ms
      limitation: Sem sincronização com execução do container; possível perda de eventos
        <50ms
      proposed_mechanisms:
      - Thread separada com polling contínuo + buffer circular
      - Sinal SIGUSR1 do container para notificar início/fim de fases
      - eBPF tracepoints para eventos kernel (syscalls, sched, block I/O)
      - cgroups v2 notify_on_release para eventos de ciclo de vida
      recommended: Thread separada + eBPF para precisão sub-ms
      status: ESPECIFICADO - não implementado (requer redesign do collector)
  output:
    raw_format: jsonl
    aggregated_format: parquet
    schema_version: '1.0'
    fields:
    - timestamp_ns
    - scenario_id
    - round
    - tool
    - phase
    - metric_name
    - metric_value
    - metric_unit
    - metadata
  validator:
    enabled: true
    checks:
    - name: output_equivalence
      description: stdout/stderr/exit_code identical between Docker and Lightr
      method: diff
      tolerance: throughput within 2%, latency within 5%
    - name: filesystem_equivalence
      description: Container filesystem identical (mtime ignored)
      method: tar | sha256sum
      exclude_patterns:
      - '**/proc/**'
      - '**/sys/**'
      - '**/tmp/**'
      - '**/var/log/**'
      - '**/*.log'
      - '**/*mtime*'
    - name: network_equivalence
      description: Network behavior identical
      method: iperf3 + curl + nslookup
      tolerance: throughput within 2%, latency within 5%
    - name: resource_limits_enforced
      description: Cgroups limits match specification
      method: cgroups_v2_read
      tolerance: within 5%
    - name: security_profile_active
      description: Seccomp/AppArmor/Capabilities active
      method: proc_pid_status + aa_status
      tolerance: exact match
reporter:
  name: bench-reporter
  language: Python
  version: 0.1.0
  analysis:
    descriptive:
    - mean
    - median
    - std
    - min
    - max
    - q25
    - q75
    - p95
    - p99
    - cv
    inferential:
    - test: mann_whitney_u
      alpha: 0.05
      alternative: two-sided
    - test: wilcoxon
      alpha: 0.05
      alternative: two-sided
    - test: ttest_ind
      alpha: 0.05
      equal_var: false
    - test: shapiro_wilk
      alpha: 0.05
    effect_sizes:
    - cohens_d
    - hedges_g
    - cliffs_delta
    - vargha_delaney_a
    confidence_intervals:
      method: bootstrap
      n_resamples: 10000
      confidence_level: 0.95
      type: bca
    multiple_comparison:
      method: holm_bonferroni
      alpha: 0.05
    power_analysis:
      post_hoc: true
      target_power: 0.8
      effect_size_threshold: 0.5
  outputs:
  - format: csv
    path: results/reports/summary.csv
    description: One row per scenario-tool-round
  - format: parquet
    path: results/reports/summary.parquet
    description: Columnar for pandas/polars
  - format: json
    path: results/reports/summary.json
    description: Structured summary with statistics
  - format: html
    path: results/reports/report.html
    description: Interactive HTML report with plots
  - format: pdf
    path: results/reports/report.pdf
    description: Printable PDF report
  - format: markdown
    path: results/reports/REPORT.md
    description: GitHub-ready markdown summary
  visualizations:
  - type: boxplot
    x: tool
    y: wall_clock_ms
    facet: category
    title: Wall-clock time by category and tool
  - type: violin
    x: tool
    y: cpu_total_ms
    facet: category
    title: CPU time distribution
  - type: scatter
    x: docker_wall_clock_ms
    y: lightr_wall_clock_ms
    color: category
    line: y=x
    title: Lightr vs Docker wall-clock correlation
  - type: bar
    x: scenario_id
    y: speedup_factor
    color: category
    title: Speedup factor (Docker/Lightr) per scenario
  - type: heatmap
    x: scenario_id
    y: metric
    color: p_value
    title: Statistical significance heatmap
  - type: forest_plot
    x: effect_size
    y: scenario_id
    color: category
    title: Effect sizes with 95% CI
  tables:
  - name: summary_by_category
    groupby:
    - category
    - tool
    metrics:
    - wall_clock_ms
    - cpu_total_ms
    - rss_peak_bytes
    stats:
    - median
    - p95
    - cv
  - name: speedup_factors
    groupby:
    - scenario_id
    metrics:
    - wall_clock_speedup
    - cpu_speedup
    - memory_ratio
    stats:
    - median
    - ci_lower
    - ci_upper
  - name: statistical_significance
    groupby:
    - scenario_id
    metrics:
    - p_value
    - effect_size
    - significant
    stats:
    - median
    - count_significant
  - name: outliers_detected
    filter: is_outlier == true
    metrics:
    - scenario_id
    - tool
    - round
    - metric_name
    - metric_value
    - zscore
execution_workflow:
  phases:
  - name: 00_verify_environment
    description: Verify hardware, software, isolation
    script: runner/scripts/00_verify_environment.sh
    required: true
  - name: 01_clone_repos
    description: Clone projects at fixed commits
    script: runner/scripts/01_clone_repos.sh
    required: true
  - name: 02_extract_dockerfiles
    description: Copy Dockerfiles and compose files to docker/
    script: runner/scripts/02_extract_dockerfiles.sh
    required: true
  - name: 03_convert_to_lightr
    description: Manual conversion Dockerfile -> Lightr spec (audited)
    script: runner/scripts/03_convert_to_lightr.sh
    required: true
    manual_review: true
  - name: 04_build_runner
    description: Compile bench-runner
    script: runner/scripts/04_build_runner.sh
    required: true
  - name: 05_dry_run
    description: Single scenario pilot (k8s build single-stage)
    script: runner/scripts/05_dry_run.sh
    required: true
    scenario: build-single-stage
    rounds: 3
  - name: 06_full_suite
    description: All 250 scenarios x 64 rounds
    script: runner/scripts/06_full_suite.sh
    required: true
    estimated_hours: 48
  - name: 07_analyze
    description: Statistical analysis + report generation
    script: runner/scripts/07_analyze.sh
    required: true
  - name: 08_validate
    description: Cross-check results, verify no anomalies
    script: runner/scripts/08_validate.sh
    required: true
  - name: 09_publish
    description: Publish results (internal)
    script: runner/scripts/09_publish.sh
    required: false
quality_gates:
  environment:
  - isolation_verification.pre_run_checks all pass
  - isolation_verification.post_run_checks all pass
  - hardware matches metadata.hardware exactly
  - software versions match metadata.software exactly
  execution:
  - all 64 rounds completed per scenario (or documented failures)
  - warmup rounds discarded, not in results
  - cold rounds have cache cleared before each
  - warm rounds have cache preserved
  - randomization seed = 42, order logged
  - no manual intervention during runs
  data:
  - raw data schema matches runner.output.schema_version
  - no missing samples (100% collection rate)
  - outliers detected and winsorized (not discarded)
  - validator checks all pass
  - effect sizes reported with 95% CI
  - multiple comparison correction applied
  - power analysis reported (post-hoc)
  - power analysis post-hoc reportado por cenário com poder observado
  - flagar cenários underpowered (poder < 0.8) no relatório final
  reporting:
  - all 6 output formats generated
  - all 6 visualization types generated
  - all 4 tables generated
  - 'markdown report includes: executive summary, methodology, results per category,
    statistical details, limitations, raw data availability'
  - raw data (jsonl + parquet) archived with checksum
  - 'reproducibility package: spec + raw data + analysis code + environment spec'
limitations:
- 'Hardware: single machine (Intel i7-9750H) — results not generalizable to other
  CPU architectures'
- 'OS: macOS host with Lima VM for Linux containers — Docker runs in VM, Lightr native
  on macOS (vz) and in VM (ns)'
- 'Sample size: 64 rounds — powered for medium-large effects (d>=0.7), underpowered
  for small effects'
- 'Projects: only 2 (k8s/kind, elasticsearch) — not representative of all Docker workloads'
- 'Scenarios: 250 scenarios — covers major surface but not exhaustive'
- 'Network: loopback only — no real network latency/bandwidth variability'
- 'Storage: NVMe only — no HDD, no network storage'
- 'Concurrency: sequential execution — no multi-tenant contention measured'
- 'Lightr engines: vz (macOS) vs ns (Linux VM) — engine comparison requires separate
  runs'
- 'Docker version: 28.3.2 — results may differ with other versions'
- No Apple Silicon (ARM64) — vz ARM64 requires separate HW
- No Windows — WSL2 requires separate HW
- No Firecracker — KVM nested virtualization not available in CI
- GPU scenarios honest-gated — requires NVIDIA GPU
- ARM64 scenarios honest-gated — requires dedicated hardware
- Swarm mode honest-gated — requires Swarm init
- Macvlan/network-plugin honest-gated — requires dedicated NIC/NFS
- User namespace remap honest-gated — requires daemon config
- Content trust/cosign honest-gated — requires Notary/Cosign setup
- Arquivo original base (benchmark-spec.yaml) corrigido manualmente; todos os 250
  cenarios presentes; YAML valido.
- 23 problemas documentados nao enderecados (requerem redesign, acesso externo, implementacao
  completa, CI, execucao completa) — documentados em correction_notes.
- 'Hashes (commit_hash): PENDING-VERIFY — nao verificados contra repositorios'
