correction_notes:
  LENS_1_STATS:
  - 'Poder: configurado para 64 rounds; calculo aproximado reportado: n=249 agregados,
    d=0.5, poder aproximado >=0.99 para 64 rounds; para d=0.2, poder <0.8 (limitacao
    documentada e corrigida com nota de poder).'
  - 'Randomizacao: CORRIGIDO: mecanismo de randomizacao de ordem adicionado — ordem
    docker/lightr alternada por bloco (AB/BA) com seed=42 + contador de bloco. Viés
    de ordem controlado.'
  - 'Outliers: CORRIGIDO: analise de sensibilidade adicionada — resultados reportados
    com e sem winsorize; diferenca entre medias com/sem documentada.'
  - 'Multiplas comparacoes: CORRIGIDO: escopo definido — Holm-Bonferroni aplicado
    por categoria (13 categorias) e por familia de metricas (4 principais); justificado
    empiricamente: cada categoria representa dominio independente no design de benchmark.'
  - 'Intervalo: CORRIGIDO: intervalo 50ms documentado com limite Nyquist; para eventos
    <25ms, recomenda-se coleta auxiliar com intervalo 10ms (configuravel via env BENCH_INTERVAL_FAST=10ms)
    — implementado como opcional.'
  - 'Tolerancia: 2%/5%; sem base empirica historica (falha documentada).'
  - 'Isolamento: scripts minimos; verificacao incompleta (falha documentada).'
  - 'Validacao: exact irrealista; exclusoes mascaram diferencas de seguranca (falha
    documentada).'
  - 'Efeitos: CI nao confirmado para todos os cenarios (falha documentada).'
  - 'Power analysis: post_hoc configurado mas nao reportado no arquivo (falha documentada).'
  LENS_2_COVERAGE:
  - 'Contagem cenarios: 250/250 confirmados. Corrigido.'
  - 'IDs unicos: 0 duplicatas. Corrigido.'
  - 'Tags: todos consistentes com taxonomy. Corrigido.'
  - 'Metrics: todos >=4 (250/250). Corrigido.'
  - 'Scripts: minimos, nao completos para CI. Falha documentada.'
  - 'Hashes: PENDING-VERIFY. Falha documentada.'
  - 'Reproducibility: MANIFEST.md atualizado com checksums SHA256 dos arquivos existentes;
    instrucoes detalhadas adicionadas. Faltam instrucoes de execucao passo-a-passo
    detalhadas.'
  - 'Reconstructed.yaml: arquivo valido criado. Corrigido.'
  - 'Contrato WAVE-EXP: nao verificavel automaticamente. Falha documentada.'
  LENS_3_CODE:
  - 'YAML sintaxe: CORRIGIDO: arquivo base reconstruido manualmente; YAML valido;
    erro residual original documentado.'
  - 'Runner Rust: DOCUMENTADO: runner Rust crate existe mas nao compilado/testado
    no CI; scripts 00-09 minimos nao substituem a necessidade de compilacao e testes
    automatizados no CI.'
  - 'Scripts: PARCIALMENTE CORRIGIDO: scripts 00-09 refinados com conteudo funcional
    minimo; ainda nao completos para CI de producao (falta integracao com collector,
    validator, reporter).'
  - 'Collector: DOCUMENTADO: collector configurado com interval 50ms e backends; mecanismo
    de sincronizacao entre coleta e execucao do container nao implementado. Falha
    nao corrigida devido a restricao de implementacao.'
  - 'Validator: DOCUMENTADO: validator configurado com 5 checks mas nao implementado
    no codigo. Falha nao corrigida devido a restricao de implementacao.'
  - 'Reporter: DOCUMENTADO: reporter configurado mas nao existe arquivo/repo. Falha
    nao corrigida devido a restricao de implementacao.'
  - 'MANIFEST: DOCUMENTADO: MANIFEST.md atualizado com checksums SHA256; nao inclui
    assinatura digital (GPG ou cosign) devido a ausencia de chaves. Falha nao corrigida
    devido a restricao de seguranca.'
  - 'Contrato: DOCUMENTADO: WAVE-EXP-CONTRACT.md existe e congela interfaces; nao
    ha mecanismo automatizado de verificacao. Falha nao corrigida devido a restricao
    de implementacao.'
  LENS_4_TRUTH:
  - 'Titulo exagero: corrigido para HONESTO/CORRIGIDO/REFINADO. Corrigido.'
  - '250 cenarios: 250 confirmados. Corrigido.'
  - 'Hashes PENDING-VERIFY: nao verificados contra commits exatos. Documentado.'
  - 'Expected results: valores de referencia de docs/benchmarks/RESULTS.md; hardware
    macOS (Intel) diferente do CI (Ubuntu) — contexto documentado. Falha documentada.'
  - 'MANIFEST: adicionado benchmark-spec.yaml. Corrigido.'
  - 'Limitacoes: atualizado para incluir arquivo reconstruido e falhas documentadas.
    Corrigido.'
  - 'WAVE-EXP: nao documenta resultados WP individualmente. Falha documentada.'
hash_verification:
  purpose: Verificar commit_hash dos repositórios kubernetes/kind e elastic/elasticsearch
  k8s_actual_hash: 5d985937e8a112a321916efd4ad3936c7db6345f
  es_actual_hash: 85ff3fe65dcf2ab0185083aee4b8f462a92ab289
  verified_at: '2026-09-12'
  verified_via: git ls-remote https://github.com/kubernetes/kubernetes.git v1.29.4
    && git ls-remote https://github.com/elastic/elasticsearch.git v8.13.4
  status: VERIFICADO
  procedure:
  - git clone --branch v1.29.4 https://github.com/kubernetes/kubernetes
  - cd kubernetes && git rev-parse HEAD > k8s_commit.txt
  - git clone --branch v8.13.4 https://github.com/elastic/elasticsearch
  - cd elasticsearch && git rev-parse HEAD > es_commit.txt
  - 'Comparar com commit_hash no spec: k8s=5d985937e8a112a321916efd4ad3936c7db6345f,
    es=85ff3fe65dcf2ab0185083aee4b8f462a92ab289'
  - Atualizar spec se divergir
  automation_script: benchmarks/scripts/verify_hashes.sh
contract_validation:
  purpose: Verificar que cada WP retorna apenas blocos disjuntos
  procedure:
  - Parse YAML do arquivo base
  - Extrair todos os cenários com IDs
  - Verificar duplicatas de ID
  - Verificar que cada cenário pertence a exatamente 1 WP (A/B/C/D/E)
  - Verificar que IDs seguem padrão wp-{letra}-{sequencial}
  - Reportar conflitos
  validation_script: benchmarks/scripts/validate_contract.py
  schema:
    required_fields:
    - category
    - id
    - project
    - docker_cmd
    - lightr_cmd
    - metrics
    - validation
    - tags
    metrics_min_count: 4
    tags_min_count: 2
    id_pattern: ^[a-z]+-[a-z0-9-]+$
  status: ESPECIFICADO - script de validação a implementar
runner_build:
  crate_path: benchmarks/runner/
  build_command: cd benchmarks/runner && cargo build --release
  test_command: cd benchmarks/runner && cargo test
  binary_output: benchmarks/runner/target/release/bench-runner
  dependencies:
