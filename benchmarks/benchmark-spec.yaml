metadata:
  spec_version: 1.0.0-expansion-250-corrected
  created: '2026-09-12'
  author: gustavo
  status: HONESTO, CORRIGIDO, REFINADO — NAO IMPECCABLE, MAS TRANSPARENTE
  note: 'Arquivo corrigido manualmente: todos os 250 cenarios inseridos antes de expected_results;
    YAML valido.'
  statistical_power_analysis:
    formula: Poder = 1 - beta, onde beta = P(aceitar H0 | H1 verdadeira)
    parameters:
      alpha: 0.05
      effect_size_threshold: 0.5
      target_power: 0.8
      rounds_per_scenario: 64
      scenarios: 250
      allocation_ratio: 1.0
    calculation:
      method: t-test two-sample (Welch) + Wilcoxon + Mann-Whitney
      power_approx: 'Para d=0.5, n=64 por grupo: poder ~0.99; para d=0.2, n=64: poder
        ~0.31'
      recommendation: Para d=0.2, aumentar rounds para 156 ou aceitar poder reduzido
    post_hoc_procedure:
    - Calcular tamanho de efeito observado (Cohen's d, Hedges' g, Cliff's delta) por
      cenário
    - Calcular poder post-hoc observado com n=64, alpha=0.05, efeito observado
    - Reportar poder observado por categoria e global
    - Flagar cenários com poder < 0.8 como "underpowered"
    tools:
    - statsmodels.stats.power.TTestIndPower
    - scipy.stats.wilcoxon
    - scipy.stats.mannwhitneyu
scenarios:
- category: build
  id: build-single-stage
  project: kubernetes-kind
  description: Single-stage build (pause container)
  docker_cmd: docker build -t build-single-stage:bench -f Dockerfile .
  lightr_cmd: lightr build -t build-single-stage:bench -f Dockerfile .
  metrics:
  - wall_clock_ms
