services:
  db:
    image: postgres:16-alpine
    command: ["postgres"]
    environment:
      POSTGRES_PASSWORD: s3-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 10
  web:
    image: nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;"]
    ports: ["18080:80"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["default"]
