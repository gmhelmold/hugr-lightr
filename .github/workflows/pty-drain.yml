name: Native PTY drain controls
on:
  pull_request:
    branches: [main, fix/snapshot-integrity]
    paths:
      - 'crates/lightr-cri-backend/src/stream*.rs'
      - 'scripts/ci/pty_controls.py'
      - '.github/workflows/pty-drain.yml'
permissions:
  contents: read
jobs:
  native-pty:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify real PTY drain and a compiled missing-reference control
        run: python3 scripts/ci/pty_controls.py --out pty-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pty-drain-${{ matrix.runner }}-${{ github.sha }}
          path: pty-evidence/
          if-no-files-found: error
          retention-days: 30
