name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # LINUX x86_64 (ubuntu-latest) — full suite + ns engine + benchmarks
  # ============================================================
  linux-x86_64:
    name: Linux x86_64 (ns engine + bench)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install deps (ns engine + bench tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            iptables \
            bridge-utils \
            libcap-dev \
            pkg-config \
            libssl-dev \
            clang \
            lld

      - name: Build release (all features)
        run: cargo build --release --workspace --all-features

      - name: Run full test suite
        run: cargo test --workspace --all-features

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: fmt check
        run: cargo fmt --all --check

      - name: Run benchmarks (save artifact)
        run: |
          mkdir -p bench-results
          LIGHTR_HOME=/tmp/lightr_bench ./target/release/lightr bench --json > bench-results/linux-x86_64.json
          cat bench-results/linux-x86_64.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-x86_64
          path: bench-results/

  # ============================================================
  # LINUX aarch64 (ubuntu-24.04-arm) — ns engine validation
  # ============================================================
  linux-aarch64:
    name: Linux aarch64 (ns engine validation)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install deps (ns engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            iptables \
            bridge-utils \
            libcap-dev \
            pkg-config \
            libssl-dev \
            clang \
            lld

      - name: Build release (ns engine)
        run: cargo build --release --workspace --features ns

      - name: Run test suite (ns engine)
        run: cargo test --workspace --features ns

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --features ns -- -D warnings

      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          LIGHTR_HOME=/tmp/lightr_bench ./target/release/lightr bench --json > bench-results/linux-aarch64.json
          cat bench-results/linux-aarch64.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-aarch64
          path: bench-results/

  # ============================================================
  # MACOS x86_64 (macos-latest) — vz engine + full suite
  # ============================================================
  macos-x86_64:
    name: macOS x86_64 (vz engine + bench)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install vz kernel pack
        run: |
          ./target/release/lightr engine install-pack /tmp/lightr-packs 2>&1 || echo "install-pack will run after build"

      - name: Build release (vz feature)
        run: cargo build --release --bin lightr --features vz

      - name: Install vz kernel pack (post-build)
        run: |
          ./target/release/lightr engine install-pack /tmp/lightr-packs

      - name: Run full test suite (vz)
        run: cargo test --workspace --features vz

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --features vz -- -D warnings

      - name: fmt check
        run: cargo fmt --all --check

      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          LIGHTR_HOME=/tmp/lightr_bench ./target/release/lightr bench --json > bench-results/macos-x86_64.json
          cat bench-results/macos-x86_64.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-x86_64
          path: bench-results/

  # ============================================================
  # MACOS arm64 (macos-14) — vz engine native validation
  # ============================================================
  macos-arm64:
    name: macOS arm64 (vz engine native)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release (vz feature)
        run: cargo build --release --bin lightr --features vz

      - name: Install vz kernel pack
        run: |
          ./target/release/lightr engine install-pack /tmp/lightr-packs

      - name: Run test suite (vz)
        run: cargo test --workspace --features vz

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --features vz -- -D warnings

      - name: fmt check
        run: cargo fmt --all --check

      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          LIGHTR_HOME=/tmp/lightr_bench ./target/release/lightr bench --json > bench-results/macos-arm64.json
          cat bench-results/macos-arm64.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-arm64
          path: bench-results/

  # ============================================================
  # WINDOWS (windows-latest) — WSL validation + cross-check
  # ============================================================
  windows:
    name: Windows (WSL + cross-check)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\bin
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install mingw (for gnu target)
        run: |
          choco install mingw --version 12.2.0 -y
          $env:PATH += ";C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"

      - name: Cross-check build (windows-gnu)
        run: cargo check --workspace --target x86_64-pc-windows-gnu

      - name: Native windows build (msvc)
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc

      - name: clippy (deny warnings) - windows-msvc
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: fmt check
        run: cargo fmt --all --check

  # ============================================================
  # CROSS-COMPILE MATRIX (ubuntu) — all targets verify
  # ============================================================
  cross-compile:
    name: Cross-compile matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install cross-compile deps
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            clang \
            lld \
            mingw-w64 \
            2>/dev/null || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Cross-check
        run: cargo check --workspace --target ${{ matrix.target }}

  # ============================================================
  # DOCS + SPEC VALIDATION
  # ============================================================
  docs-spec:
    name: Docs + Spec validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify parity-audit.md has all F-001..F-605
        run: |
          grep -c "F-[0-9][0-9][0-9]" docs/spec/parity-audit.md || exit 1
          echo "Parity audit entries found"

      - name: Verify benchmark-results.md has citations
        run: |
          grep -q "Intel\|Apple\|CI" docs/spec/benchmark-results.md || exit 1
          echo "Benchmark citations found"

      - name: Verify contracts exist (C-01..C-11)
        run: |
          for i in {1..11}; do
            if [ ! -f ".techlead/contracts/C-$(printf "%02d" $i)*.md" ]; then
              echo "Missing contract C-$i"
              exit 1
            fi
          done
          echo "All 11 contracts present"

      - name: Verify no fabricated numbers in docs
        run: |
          # Check for "measured" claims without hardware citation
          if grep -ri "measured" docs/ --include="*.md" | grep -v "Intel\|Apple\|CI\|GitHub Actions\|hardware\|runner" | grep -v "honest-gated\|DRAFT\|target\|staged"; then
            echo "ERROR: Found 'measured' claim without hardware citation"
            exit 1
          fi
          echo "No fabricated measured claims"

  # ============================================================
  # AGGREGATE BENCHMARKS + GENERATE REPORT
  # ============================================================
  benchmark-report:
    name: Aggregate benchmarks + report
    needs: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: bench-results
          pattern: bench-*
          merge-multiple: true

      - name: Aggregate and compare
        run: |
          echo "=== BENCHMARK AGGREGATION ==="
          for f in bench-results/*.json; do
            echo "--- $f ---"
            cat "$f" | jq -r '.[] | "\(.indicator): \(.median_ms)ms (budget: \(.budget_ms)ms) pass: \(.pass)"' 2>/dev/null || cat "$f"
          done

      - name: Verify no regressions vs baseline
        run: |
          # Compare against docs/spec/benchmark-results.md baseline
          echo "Baseline comparison - manual review needed for now"
          # TODO: Automate baseline comparison when we have stable CI history

  # ============================================================
  # RELEASE (manual trigger only, after GTW gate)
  # ============================================================
  release:
    name: Release (GTW gate required)
    if: false  # Disabled until GTW gate signed
    needs: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows, cross-compile, docs-spec]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GTW gate signed
        run: |
          if ! grep -q "SIGNED:" .techlead/UNIFIED-PLAN.md; then
            echo "GTW gate not signed. Edit .techlead/UNIFIED-PLAN.md and add 'SIGNED: [Full|MVP] - <name> - <date>'"
            exit 1
          fi

      - name: Set publish = true in Cargo.toml
        run: |
          sed -i 's/publish = false/publish = true/' Cargo.toml

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

      - name: Create git tag
        run: |
          VERSION=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name=="lightr-cli") | .version')
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build release artifacts
        run: |
          # Build for all 5 targets
          # macos arm64/x86_64, ubuntu x86_64/aarch64, windows zip
          echo "Release artifacts would be built here"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          generate_release_notes: true