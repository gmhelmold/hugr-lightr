name: SI01 pure foundation controls
on:
  pull_request:
    branches: [fix/snapshot-integrity]
    paths: ['crates/lightr-store/src/store/foundation/**', 'crates/lightr-core/src/core/digest.rs', 'scripts/si01/**', '.github/workflows/si01-pure.yml']
permissions:
  contents: read
concurrency:
  group: si01-pure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiled-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Pinned compiler
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Compile and kill exact codec defects in disposable source
        run: python3 scripts/si01/pure_controls.py --out si01-pure-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: si01-pure-${{ github.sha }}
          path: si01-pure-evidence/
          if-no-files-found: error
          retention-days: 30
